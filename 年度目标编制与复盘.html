function renderSummaryShareMatrix(rows){

  if(!rows.length||!total){box.innerHTML='<div class="matrix-empty">暂无地区贡献率数据</div>';return}
  const colors=["#4e79a7","#f28e2c","#e15759","#76b7b2","#59a14f","#edc949","#af7aa1","#ff9da7","#9c755f","#bab0ab"];
  const items=rows.filter(r=>r.stats.done>0).sort((a,b)=>b.stats.done-a.stats.done).map((r,i)=>({name:r.project.name,value:r.stats.done,color:colors[i%colors.length]}));
  const layout=(list,x,y,w,h)=>{
    if(!list.length)return[];
    if(list.length===1)return[{...list[0],x,y,w,h}];
    const sum=list.reduce((s,it)=>s+it.value,0);
    let acc=0,split=1;
    for(let i=0;i<list.length;i++){if(acc<sum/2){acc+=list[i].value;split=i+1}}
    split=Math.min(Math.max(split,1),list.length-1);
    const first=list.slice(0,split),second=list.slice(split),firstSum=first.reduce((s,it)=>s+it.value,0);
    if(w>=h){
      const w1=w*(firstSum/sum);
      return [...layout(first,x,y,w1,h),...layout(second,x+w1,y,w-w1,h)];
    }
    const h1=h*(firstSum/sum);
    return [...layout(first,x,y,w,h1),...layout(second,x,y+h1,w,h-h1)];
  };

  }).join("");

function showFloatingTip(el){
  let tip=document.getElementById("floatingTip");
  if(!tip){tip=document.createElement("div");tip.id="floatingTip";tip.className="floating-tip";document.body.appendChild(tip)}
  tip.textContent=el.dataset.tip||"";
  const rect=el.getBoundingClientRect();
  tip.classList.add("show");
  const tipRect=tip.getBoundingClientRect(),gap=8;
  let left=rect.left+rect.width/2-tipRect.width/2;
  left=Math.max(8,Math.min(left,window.innerWidth-tipRect.width-8));
  let top=rect.bottom+gap;
  if(top+tipRect.height>window.innerHeight-8)top=rect.top-tipRect.height-gap;
  tip.style.left=`${left}px`;
  tip.style.top=`${Math.max(8,top)}px`;
}

    const provinceName=btn.dataset.province,p=region[provinceName],next=!p.confirmLocked,verb=next?"锁定":"放开";
    if(next&&!isProvinceConfirmable(p)){toast("该省项目组目标合计与汇总目标不一致，暂不能锁定");return}
    p.confirmLocked=next;closeNumEditor();addLog(`${provinceName}省级项目组目标已${verb}`,"系统直接操作");render();toast(`${provinceName}省级项目目标已${verb}`);
    return;
  }
  if(action==="toggle-all-province-project-lock"){
    const names=currentRegionProvinceNames().filter(name=>region[name]),anyLocked=names.some(name=>region[name].confirmLocked),next=!anyLocked,verb=next?"锁定":"解锁";
    let changed=0,skipped=0;
    names.forEach(name=>{const p=region[name];if(next&&!isProvinceConfirmable(p)){skipped++;return}if(p.confirmLocked!==next)changed++;p.confirmLocked=next});
    closeNumEditor();addLog(`可见省份省级确认已一键${verb}`,"表头小锁操作");render();toast(next&&skipped?`已锁定 ${changed} 个，${skipped} 个省级目标不一致已跳过`:`已一键${verb}省级确认`);
    return;
  }
  if(action==="toggle-province-city-lock"){
    const provinceName=btn.dataset.province,p=region[provinceName];
    if(!canManageCityConfirmation(provinceName)){toast("仅运营或该省省级成长顾问可操作城市确认");return}
    const next=!cityConfirmationStat(p).all,verb=next?"确认并锁定":"解锁";
    p.cities.forEach(c=>c.confirmLocked=next);p.cityConfirmLocked=next;
    closeNumEditor();addLog(`${provinceName}全部城市目标已${verb}`,"城市确认");render();toast(`${provinceName}全部城市目标已${verb}`);
    return;
  }
  if(action==="toggle-all-province-city-lock"){
    const names=roleProvinceNames().filter(name=>region[name]),allLocked=names.length>0&&names.every(name=>cityConfirmationStat(region[name]).all),next=!allLocked,verb=next?"确认并锁定":"解锁";
    names.forEach(name=>{const p=region[name];p.cities.forEach(c=>c.confirmLocked=next);p.cityConfirmLocked=next});
    closeNumEditor();addLog(`全部可见省份的城市目标已一键${verb}`,"城市确认表头小锁");render();toast(`已一键${verb}全部城市目标`);
    return;
  }
});
document.getElementById("toggleTreeBtn").onclick=()=>{
  const {groupNames,provinceNames,cityKeys}=visibleRegionTreeKeys();
  if(!isRegionTreeFullyExpanded()){
    state.collapsedGroups.clear();state.collapsedProvinces.clear();state.collapsedCities.clear();
    renderRegion();toast("已展开全部层级");return;
  }
  groupNames.forEach(name=>state.collapsedGroups.add(name));
  provinceNames.forEach(name=>state.collapsedProvinces.add(name));
  cityKeys.forEach(key=>state.collapsedCities.add(key));
  renderRegion();toast("已折叠全部层级");
};
document.getElementById("toggleSummaryTreeBtn").onclick=()=>{
  if(isSummaryTreeFullyCollapsed()){
    state.collapsedSummaryProjects.clear();state.collapsedSummaryProvinces.clear();renderSummary();toast("项目组维度已展开");return;
  }
  state.collapsedSummaryProjects.clear();state.collapsedSummaryProvinces.clear();
  pickerVisibleProjects("summary").filter(p=>summarySelectedProjects.has(p.name)).forEach(p=>state.collapsedSummaryProjects.add(p.name));
  renderSummary();toast("项目组维度已折叠");
};
document.getElementById("numEditSave").onclick=e=>{e.stopPropagation();saveCellEditor()};
document.getElementById("numEditCancel").onclick=e=>{e.stopPropagation();closeNumEditor()};
document.getElementById("numEditInput").onkeydown=e=>{if(e.key==="Enter")saveCellEditor();if(e.key==="Escape")closeNumEditor()};
document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("confirm").onclick=()=>{const r=document.getElementById("reason").value.trim()||"未填写原因";document.getElementById("modal").classList.remove("show");if(state.pending)state.pending(r);state.pending=null};
document.getElementById("summary").addEventListener("wheel",e=>{
  const tableWrap=e.target.closest(".table-wrap");
  if(!tableWrap||e.shiftKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  const panel=e.currentTarget;
  const panelMax=Math.max(0,panel.scrollHeight-panel.clientHeight);
  if(e.deltaY>0&&panel.scrollTop<panelMax-1){
    e.preventDefault();
    panel.scrollTop=Math.min(panelMax,panel.scrollTop+e.deltaY);
    return;
  }
  if(e.deltaY<0&&tableWrap.scrollTop<=1&&panel.scrollTop>0){
    e.preventDefault();
    panel.scrollTop=Math.max(0,panel.scrollTop+e.deltaY);
  }
},{passive:false});
render();
</script>
</body>
</html>
