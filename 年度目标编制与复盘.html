<style>

.content{flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.panel{display:none;min-height:0;flex:1;flex-direction:column;gap:12px;overflow:hidden}.panel.active{display:flex}

.rate-pill{display:inline;font-size:12px;font-weight:800}.rate-red{color:#dc2626}.rate-yellow{color:#b7791f}.rate-green{color:#059669}.rate-na{color:#94a3b8}.rate-cell{text-align:center!important}.fillable-cell{position:relative}.fillable-cell:hover{background:#f8fafc!important}
.notice{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:9px 12px;font-size:12px;flex-shrink:0}.notice.warn{border-color:#fed7aa;background:#fff7ed;color:#a4530a}
.log{border-bottom:1px solid #edf1f7;padding:8px 0}.log:last-child{border-bottom:0}.log strong{display:block}.log span{font-size:12px;color:var(--muted)}

.modal-back{position:fixed;inset:0;background:#0f172a55;display:none;align-items:center;justify-content:center;z-index:60}.modal-back.show{display:flex}.modal{width:min(500px,92vw);background:#fff;border-radius:14px;padding:16px}.modal h3{font-size:16px}.modal textarea{width:100%;height:84px;border:1px solid #d5deec;border-radius:10px;padding:10px;margin:10px 0;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.hidden{display:none!important}
.unit-status-board{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-shrink:0}.unit-status-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.unit-status-head h3{font-size:13px}.unit-status-head span{font-size:12px;color:var(--muted)}.unit-status-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.unit-card{min-width:220px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fafcff}.unit-card.province-unit{border-color:#93c5fd;background:#eff6ff}.unit-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.unit-card-name{font-weight:800;overflow:hidden;text-overflow:ellipsis}.unit-card-value{font-size:12px;color:var(--muted);margin:5px 0}.unit-card-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.lock-tag{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:#f1f5f9;color:#475569}.lock-tag.locked{background:#e2e8f0;color:#1e293b}.status-btns{display:inline-flex;gap:5px;flex-wrap:wrap}

@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.top{height:auto;align-items:flex-start;flex-direction:column;padding:12px}.top-r{margin-left:0;flex-wrap:wrap}.tabs{overflow:auto}.content{padding:10px}}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">年</div><div><h1>年度目标与复盘</h1><p>模拟成品效果</p></div></div>
    <div class="nav-title">核心页面</div>
    <div class="nav-item active"><span class="dot"></span>汇总查看</div>
    <div class="nav-item"><span class="dot"></span>省市情况</div>
    <div class="nav-title">操作能力</div>
    <div class="nav-item"><span class="dot"></span>保存草稿</div>
    <div class="nav-item"><span class="dot"></span>按维度一键锁定</div>
    <div class="side-foot" id="roleTip">当前角色：运营<br>可在每个省级行锁定汇总目标或项目组及下级目标。</div>
  </aside>

  <main class="main">
    <header class="top">
      <div><h2>年度目标编制与复盘</h2><div class="sub">目标按单元填写，编辑权限按业务维度统一控制。</div></div>
      <div class="top-r">
        <select class="select" id="year"><option>2026 年</option><option>2025 年</option><option>2024 年</option></select>
        <select class="select" id="role"><option value="ops">运营</option><option value="project">项目组负责人</option><option value="province">省负责人（浙江）</option><option value="city">市负责人（深圳-王五）</option></select>
        <div class="top-context summary-action">
          <div class="project-picker" data-picker="summary">
            <button class="project-pick-btn" data-picker-toggle="summary"><span id="summaryProjectPickLabel"></span><span>▾</span></button>
            <div class="project-pick-drop" id="summaryProjectPickDrop">
              <input class="project-pick-search" data-picker-search="summary" placeholder="搜索项目组…">
              <div class="project-pick-actions"><button data-picker-all="summary">全选</button><button data-picker-clear="summary">清空</button></div>
              <div class="project-pick-list" id="summaryProjectPickList"></div>
            </div>
          </div>
          <button class="btn ops-only" id="unlockAllProductBtn">一键放开本页编辑</button>
          <button class="btn primary ops-only" id="lockAllProductBtn">一键锁定本页编辑</button>
        </div>
        <div class="top-context region-action hidden">
          <div class="project-picker" data-picker="region">
            <button class="project-pick-btn" data-picker-toggle="region"><span id="regionProjectPickLabel"></span><span class="project-pick-warn hidden" id="regionProjectPickWarn">列较多</span><span>▾</span></button>
            <div class="project-pick-drop" id="regionProjectPickDrop">
              <input class="project-pick-search" data-picker-search="region" placeholder="搜索项目组…">
              <div class="project-pick-actions"><button data-picker-all="region">全选</button><button data-picker-clear="region">清空</button></div>
              <div class="project-pick-list" id="regionProjectPickList"></div>
            </div>
          </div>
          <button class="btn" id="toggleTreeBtn">全部折叠</button>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="summary">汇总查看</button>
      <button class="tab" data-tab="region">省市情况</button>
    </div>

    <section class="content">
      <section class="panel active" id="summary">
        <div class="bar">
          <div class="bar-item">宇佳设定本年度经营目标：<b id="annualTargetText"></b></div>
          <div class="bar-item">各项目组销售目标合计：<b id="salesSumText"></b></div>
          <div class="bar-item">目标差额：<b id="annualDiffText"></b></div>
          <div class="bar-item">产品目标权限：<b id="productTargetLockText"></b></div>
          <div class="tools"><span class="bar-item">提示：各项目组负责人进入后只编辑自己负责项目组</span></div>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th class="sticky" rowspan="2">课程项目组</th><th rowspan="2">产品目标（万）</th><th rowspan="2">销售目标（万）</th><th rowspan="2">产品/销售差异（万）</th><th rowspan="2">年度总达成（万）</th><th rowspan="2">达成率</th><th rowspan="2">缺口（万）</th><th rowspan="2">全部期数</th><th rowspan="2">已开期数</th><th rowspan="2">剩余期数</th><th rowspan="2">剩余每期最小目标（万）</th><th class="group-th" colspan="4">季度达成（万）</th></tr>
                <tr><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr>
              </thead>
              <tbody id="summaryRows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel" id="region">
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead id="regionHead"></thead>
              <tbody id="regionRows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </section>
  </main>
</div>

<div class="num-edit-pop" id="numEditPop">
  <div class="num-edit-label" id="numEditLabel"></div>
  <input id="numEditInput" type="number" min="0" step="1">
  <div class="num-edit-extra hidden" id="numEditExtra"></div>
  <div class="num-edit-actions"><button class="mini-btn" id="numEditCancel">取消</button><button class="mini-btn primary" id="numEditSave">保存</button></div>
</div>
<div class="modal-back" id="modal"><div class="modal"><h3 id="modalTitle">填写修改原因</h3><textarea id="reason" placeholder="例如：线下会后调整目标"></textarea><div class="modal-actions"><button class="btn" id="cancel">取消</button><button class="btn primary" id="confirm">确认</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
let state={role:"ops",activeTab:"summary",productTargetsLocked:false,provinceConfirmFilter:"all",pending:null,editing:null,openPicker:null,cellEditor:null,collapsedProvinces:new Set(),collapsedCities:new Set(),logs:[
  ["广东省-广州市-张三-经典一刻","目标从 286 万调整为 300 万 · 会议后调整：是"],
  ["阳明心学","全年期数从 15 调整为 16 · 会议后调整：否"]
]};
const AMOUNT_UNIT=10000,amount=n=>n*AMOUNT_UNIT;
const annualTarget=amount(35148);
const coreProjectNames=["经典一刻","阳明心学","道德经","领导力共创会","战略领导力","易经"];

    if(!cityScoped){
      const editable=canEditRegionRow("province",provinceName,null,null),confirmed=isProvinceConfirmed(p),completed=isProvinceCompleted(p);
      const targetCell=`<div class="goal-with-diff"><span class="cell-edit-wrap"><span>${fmtAmount(p.target)}</span>${editable?regionEditIcon("province",provinceName,"","","",`${provinceName} · 汇总目标`):""}${lockIcon("toggle-province-summary-lock",provinceName,p.locked,"汇总目标")}</span>${diffHint(provinceProjectDiff(p))}</div>`;
      const provinceDone=p.cities.reduce((s,c)=>s+c.done,0);
      html+=`<tr class="lv1"><td class="sticky"><div class="tree"><button class="tree-toggle" data-action="toggle-tree" data-level="province" data-tree-key="${provinceName}" title="${provinceCollapsed?"展开":"折叠"}${provinceName}">${provinceCollapsed?"▶":"▼"}</button>${provinceName}</div></td><td class="sticky2"><span class="advisor-list" title="省负责人：${p.owner}">${p.owner}</span></td><td class="sticky3"><span class="status-cell">${confirmTag(confirmed?"done":"draft")}${lockIcon("toggle-province-project-lock",provinceName,p.confirmLocked,"各项目组目标及下级市区目标")}</span></td><td class="sticky4">${completeTag(completed)}</td><td class="num ${editable?"fillable-cell":""}" ${editable?'title="可填写省级汇总目标"':""}>${targetCell}</td><td class="num">${fmtAmount(provinceDone)}</td><td class="rate-cell">${rateBadge(provinceDone,p.target)}</td>${renderProvinceProjectCells(p,provinceName,shown)}</tr>`;
    }
    if(provinceCollapsed&&!cityScoped)return;
    vc.forEach(([c,ci])=>{
    const cityTreeKey=`${provinceName}|${ci}`,hasMultipleOwners=c.owners.length>1,cityCollapsed=hasMultipleOwners&&state.collapsedCities.has(cityTreeKey),singleOwnerEditable=!hasMultipleOwners&&canEditRegionRow("owner",provinceName,c.name,c.owners[0][0]),advisorText=hasMultipleOwners?c.owners.map(o=>o[0]).join("、"):c.owners[0][0];
    const targetCell=`<span class="value-history"><span>${fmtAmount(c.target)}</span></span>`;
    const cityToggle=hasMultipleOwners?`<button class="tree-toggle" data-action="toggle-tree" data-level="city" data-tree-key="${cityTreeKey}" title="${cityCollapsed?"展开":"折叠"}${c.name}">${cityCollapsed?"▶":"▼"}</button>`:`<span class="tree-spacer"></span>`;
    html+=`<tr class="lv2"><td class="sticky"><div class="tree ${cityScoped?"":"indent1"}">${cityToggle}${c.name}</div></td><td class="sticky2"><span class="advisor-list" title="${advisorText}">${advisorText}</span></td><td class="sticky3"></td><td class="sticky4"></td><td class="num">${targetCell}</td><td class="num">${fmtAmount(c.done)}</td><td class="rate-cell">${rateBadge(c.done,c.target)}</td>${renderCityProjectCells(c,provinceName,ci,singleOwnerEditable,shown)}</tr>`;
    if(!hasMultipleOwners||cityCollapsed)return;
    c.owners.forEach((o,oi)=>{
      const ownerEditable=canEditRegionRow("owner",provinceName,c.name,o[0]);
      const ownerTarget=`<span class="value-history"><span>${fmtAmount(o[1])}</span></span>`;
      html+=`<tr class="lv3"><td class="sticky"><div class="tree ${cityScoped?"indent1":"indent2"}"><span class="muted">↳</span></div></td><td class="sticky2">${o[0]}</td><td class="sticky3"></td><td class="sticky4"></td><td class="num">${ownerTarget}</td><td class="num">${fmtAmount(o[2])}</td><td class="rate-cell">${rateBadge(o[2],o[1])}</td>${renderOwnerProjectCells(o,c,provinceName,ci,oi,ownerEditable,shown)}</tr>`;
    });
    });
  });
  document.getElementById("regionRows").innerHTML=html;
  updateRegionToolbar();
}
function isRegionTreeFullyCollapsed(){
  const provinceNames=roleProvinceNames();
  if(state.role!=="city")return provinceNames.length>0&&provinceNames.every(name=>state.collapsedProvinces.has(name));
  const cityKeys=provinceNames.flatMap(name=>visibleCities(region[name]).filter(([c])=>c.owners.length>1).map(([,ci])=>`${name}|${ci}`));
  return cityKeys.length>0&&cityKeys.every(key=>state.collapsedCities.has(key));
}
function updateRegionToolbar(){
  const treeBtn=document.getElementById("toggleTreeBtn");
  treeBtn.textContent=isRegionTreeFullyCollapsed()?"全部展开":"全部折叠";
}
function renderLogs(){}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.classList.contains("hidden"))return;switchTab(b.dataset.tab)});
document.addEventListener("input",e=>{
  const type=e.target.dataset.pickerSearch;if(type){renderProjectPicker(type);return}
  if(e.target.id==="numEditInput")updateNumEditExtra();
});
document.addEventListener("change",e=>{
  if(e.target.id==="role"){state.role=e.target.value;closeProjectPickers();render()}
  if(e.target.id==="provinceConfirmFilter"){state.provinceConfirmFilter=e.target.value;renderRegion()}
  if(e.target.id==="projectFilter"){renderSummary()}
  const type=e.target.dataset.pickerCheck;if(type){const set=pickerSet(type);e.target.checked?set.add(e.target.dataset.project):set.delete(e.target.dataset.project);refreshProjectSelection(type)}
});
document.addEventListener("click",e=>{
  if(!e.target.closest("#numEditPop")&&!e.target.closest('[data-action="edit-summary-cell"]')&&!e.target.closest('[data-action="edit-region-cell"]'))closeNumEditor();
  const pickerToggle=e.target.closest("[data-picker-toggle]");
  if(pickerToggle){e.stopPropagation();const type=pickerToggle.dataset.pickerToggle,willOpen=state.openPicker!==type;closeProjectPickers();if(willOpen){state.openPicker=type;document.getElementById(`${type}ProjectPickDrop`).classList.add("show");pickerToggle.classList.add("open");const search=document.querySelector(`[data-picker-search="${type}"]`);search.value="";renderProjectPicker(type);search.focus()}return}
  const all=e.target.closest("[data-picker-all]");if(all){e.stopPropagation();pickerVisibleProjects(all.dataset.pickerAll).forEach(p=>pickerSet(all.dataset.pickerAll).add(p.name));refreshProjectSelection(all.dataset.pickerAll);return}
  const clear=e.target.closest("[data-picker-clear]");if(clear){e.stopPropagation();pickerVisibleProjects(clear.dataset.pickerClear).forEach(p=>pickerSet(clear.dataset.pickerClear).delete(p.name));refreshProjectSelection(clear.dataset.pickerClear);return}
  if(!e.target.closest(".project-picker"))closeProjectPickers();
  const btn=e.target.closest("[data-action]");
  if(!btn) return;
  const action=btn.dataset.action;
  if(action==="toggle-tree"){
    const set=btn.dataset.level==="province"?state.collapsedProvinces:state.collapsedCities,key=btn.dataset.treeKey;
    set.has(key)?set.delete(key):set.add(key);
    renderRegion();
    return;
  }
  if(action==="edit-summary-cell"){openSummaryCellEditor(btn,btn.dataset.name,btn.dataset.field,btn.dataset.label);return}
  if(action==="edit-region-cell"){openRegionCellEditor(btn,btn.dataset.editKind,btn.dataset.province,btn.dataset.city,btn.dataset.owner,btn.dataset.project,btn.dataset.label);return}
  if(action==="toggle-province-summary-lock"){
    const provinceName=btn.dataset.province,p=region[provinceName],next=!p.locked,verb=next?"锁定":"放开";
    p.locked=next;closeNumEditor();addLog(`${provinceName}汇总目标已${verb}`,"系统直接操作");render();toast(`${provinceName}汇总目标已${verb}`);
    return;
  }
  if(action==="toggle-province-project-lock"){
    const provinceName=btn.dataset.province,p=region[provinceName],next=!p.confirmLocked,verb=next?"锁定":"放开";
    if(next&&!isProvinceCompleted(p)){toast("该省填写未完成，暂不能锁定项目组及下级目标");return}
    p.confirmLocked=next;closeNumEditor();addLog(`${provinceName}各项目组目标及下级市区目标已${verb}`,"系统直接操作");render();toast(`${provinceName}项目组及下级目标已${verb}`);
    return;
  }
});
document.getElementById("lockAllProductBtn").onclick=()=>ask("一键锁定汇总查看全部编辑权限原因",reason=>{state.productTargetsLocked=true;projects.forEach(p=>p.locked=true);state.editing=null;closeNumEditor();addLog("汇总查看全部编辑权限已锁定",reason);render();toast("已一键锁定本页全部编辑权限")});
document.getElementById("unlockAllProductBtn").onclick=()=>ask("一键放开汇总查看全部编辑权限原因",reason=>{state.productTargetsLocked=false;projects.forEach(p=>p.locked=false);addLog("汇总查看全部编辑权限已放开",reason);render();toast("已一键放开本页全部编辑权限")});
document.getElementById("toggleTreeBtn").onclick=()=>{
  if(isRegionTreeFullyCollapsed()){
    state.collapsedProvinces.clear();state.collapsedCities.clear();renderRegion();toast("已展开全部省市");return;
  }
  state.collapsedProvinces.clear();state.collapsedCities.clear();
  roleProvinceNames().forEach(provinceName=>{
    if(state.role!=="city")state.collapsedProvinces.add(provinceName);
    visibleCities(region[provinceName]).filter(([c])=>c.owners.length>1).forEach(([,ci])=>state.collapsedCities.add(`${provinceName}|${ci}`));
  });
  renderRegion();toast("已折叠全部省市");
};
document.getElementById("numEditSave").onclick=e=>{e.stopPropagation();saveCellEditor()};
document.getElementById("numEditCancel").onclick=e=>{e.stopPropagation();closeNumEditor()};
document.getElementById("numEditInput").onkeydown=e=>{if(e.key==="Enter")saveCellEditor();if(e.key==="Escape")closeNumEditor()};
document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("confirm").onclick=()=>{const r=document.getElementById("reason").value.trim()||"未填写原因";document.getElementById("modal").classList.remove("show");if(state.pending)state.pending(r);state.pending=null};
render();
</script>
</body>
</html>
